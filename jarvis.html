<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main><section class="hero"><span class="eyebrow">🎙️ Browser voice demo</span><h1>🤖 <span class="gradient-text">JARVIS</span></h1><p class="subtitle">Try commands such as time, date, calculator, projects or hello.</p></section><div class="card tool-box"><div class="toolbar"><input id="cmd" class="input" placeholder="Type a command"><button class="btn" id="run">Run</button></div><div class="hero-actions"><button class="btn" id="listen">🎤 Listen</button><button class="btn secondary" id="speak">🔊 Repeat</button></div><div class="result" id="res">Ready.</div></div></main><div id="foot"></div></div></div>
<script>bootNav("projects");let last="Ready.";function answer(q){let s=q.toLowerCase(),o=s.includes("time")?"The current time is "+new Date().toLocaleTimeString():s.includes("date")?"Today is "+new Date().toLocaleDateString():s.includes("hello")?"Hello! JARVIS is online.":s.includes("calculator")?"Opening calculator.":s.includes("projects")?"Opening projects.":"Try time, date, hello, calculator or projects.";last=o;res.textContent=o;if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(o));if(s.includes("calculator"))setTimeout(()=>location.href="calculator.html",600);if(s.includes("projects"))setTimeout(()=>location.href="projects.html",600)}run.onclick=()=>{if(cmd.value.trim())answer(cmd.value)};speak.onclick=()=>speechSynthesis?.speak(new SpeechSynthesisUtterance(last));listen.onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("Speech recognition is not supported.");const r=new R();r.lang="en-IN";r.onresult=e=>{cmd.value=e.results[0][0].transcript;answer(cmd.value)};r.start()};document.getElementById("foot").innerHTML=footer()</script></body></html>
