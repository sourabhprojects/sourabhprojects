<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Generator | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main><section class="hero"><span class="eyebrow">🔳 Utility</span><h1>QR <span class="gradient-text">Generator</span></h1></section><div class="card tool-box"><div class="field"><label>Text or URL</label><textarea id="data" class="textarea" placeholder="https://example.com"></textarea></div><div class="hero-actions"><button class="btn" id="gen">Generate QR</button><button class="btn secondary" id="clear">Clear</button></div><div class="result" id="out">Your QR code will appear here.</div></div></main><div id="foot"></div></div></div>
<script>bootNav("projects");const d=document.getElementById("data"),o=document.getElementById("out");document.getElementById("gen").onclick=()=>{const v=d.value.trim();if(!v)return o.textContent="Enter text first.";o.innerHTML=`<img alt="QR code" width="240" height="240" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(v)}">`;addXP(1)};document.getElementById("clear").onclick=()=>{d.value="";o.textContent="Your QR code will appear here."};document.getElementById("foot").innerHTML=footer()</script></body></html>
