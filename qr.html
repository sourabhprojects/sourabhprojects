<!DOCTYPE html>
<html lang="en">
<head>
<title>QR Code Generator | Sourabh Projects</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="container">
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.svg" alt="SM logo"><span>Sourabh Projects</span></a>
  <nav class="nav"><a class="" href="index.html">Home</a><a class="" href="projects.html">Projects</a><a class="" href="profile.html">Profile</a><a class="" href="mailbox.html">Mailbox</a><a class="" href="about.html">About</a></nav>
</header>

<main>
<section class="tool-box card">
  <h1>🔳 QR Code <span class="gradient-text">Generator</span></h1>
  <p class="lead">Enter text, a URL, a Wi-Fi string, or anything else and generate a scannable code.</p>
  <div class="field"><label>Text or URL</label><textarea id="data" class="textarea" placeholder="https://sourabhprojects.github.io/sourabhprojects/"></textarea></div>
  <div class="hero-actions"><button class="btn" id="gen">Generate QR</button><button class="btn secondary" id="clear">Clear</button></div>
  <div class="result" id="out" style="text-align:center"><span class="prose">Your QR code will appear here.</span></div>
</section>
</main>
<script>
const data=document.getElementById('data'),out=document.getElementById('out');
document.getElementById('gen').onclick=()=>{
 const v=data.value.trim();if(!v)return toast('Enter some text first');
 const img=document.createElement('img');img.alt='Generated QR code';img.width=240;img.height=240;
 img.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(v);
 out.innerHTML='';out.appendChild(img);
 const p=document.createElement('p');p.className='notice';p.style.marginTop='12px';p.textContent=v;out.appendChild(p);
};
document.getElementById('clear').onclick=()=>{data.value='';out.innerHTML='<span class="prose">Your QR code will appear here.</span>'};
</script>
<footer class="footer">Built with HTML, CSS & JavaScript • <a href="projects.html">Explore projects</a></footer>
</div></div>
<div class="toast" id="toast"></div>
<script>
document.addEventListener("click",e=>{
  const b=e.target.closest(".btn,button");
  if(!b)return;
  const r=document.createElement("span"); r.className="ripple";
  const rect=b.getBoundingClientRect(), size=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=size+"px"; r.style.left=e.clientX-rect.left-size/2+"px"; r.style.top=e.clientY-rect.top-size/2+"px";
  b.appendChild(r); setTimeout(()=>r.remove(),650);
});
function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg; t.classList.add("show"); clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
</body>
</html>
