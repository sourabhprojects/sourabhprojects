<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main><section class="hero"><span class="eyebrow">🌦️ API Project</span><h1>Weather <span class="gradient-text">Checker</span></h1></section><div class="card tool-box"><div class="toolbar"><input id="city" class="input" value="Indore" placeholder="City"><button class="btn" id="search">Search</button></div><div id="status" class="notice">Ready.</div><div id="weather"></div></div></main><div id="foot"></div></div></div>
<script>
bootNav("projects");const city=document.getElementById("city"),status=document.getElementById("status"),weather=document.getElementById("weather");
function text(c){return ({0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",51:"Drizzle",61:"Rain",63:"Rain",65:"Heavy rain",80:"Rain showers",95:"Thunderstorm"})[c]||"Weather"}
async function go(){const q=city.value.trim();if(!q)return;status.textContent="Loading...";try{const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&format=json").then(r=>r.json());if(!g.results?.length)throw 0;const x=g.results[0];const d=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${x.latitude}&longitude=${x.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`).then(r=>r.json());weather.innerHTML=`<div class="card site-card"><h2>${x.name}, ${x.country||""}</h2><p class="lead" style="margin:7px 0;text-align:left">${text(d.current.weather_code)}</p><div class="stats"><div class="stat"><strong>${Math.round(d.current.temperature_2m)}°C</strong><span>Temperature</span></div><div class="stat"><strong>${d.current.relative_humidity_2m}%</strong><span>Humidity</span></div><div class="stat"><strong>${Math.round(d.current.wind_speed_10m)} km/h</strong><span>Wind</span></div></div></div>`;status.textContent="Updated successfully.";addXP(1)}catch{status.textContent="Could not load weather right now."}}
document.getElementById("search").onclick=go;city.onkeydown=e=>{if(e.key==="Enter")go()};go();document.getElementById("foot").innerHTML=footer();
</script></body></html>
