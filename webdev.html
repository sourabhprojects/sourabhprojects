<!DOCTYPE html>
<html lang="en">
<head>
<title>Web Development Lab | Sourabh Projects</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="container">
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.svg" alt="SM logo"><span>Sourabh Projects</span></a>
  <nav class="nav"><a class="" href="index.html">Home</a><a class="" href="projects.html">Projects</a><a class="" href="about.html">About</a></nav>
</header>

<main>
<section class="tool-box card">
  <h1>🌐 Web <span class="gradient-text">Playground</span></h1>
  <p class="lead">Edit HTML and CSS, then preview the result instantly in a safe sandboxed frame.</p>
  <div class="row">
    <div>
      <div class="field"><label>HTML</label><textarea id="html" class="textarea" style="min-height:260px"><h2>Hello from my playground 👋</h2><p>Edit this HTML and CSS.</p><button onclick="alert('Button works!')">Test button</button></textarea></div>
      <div class="field"><label>CSS</label><textarea id="css" class="textarea" style="min-height:220px">body{font-family:system-ui;padding:24px;background:#0b1020;color:white}button{padding:10px 14px;border-radius:12px;border:0;background:#7c5cff;color:white}</textarea></div>
      <button class="btn" id="run">▶ Run preview</button>
    </div>
    <div class="card site-card">
      <h2>Live preview</h2>
      <iframe id="frame" title="Live web preview" sandbox="allow-scripts" style="width:100%;height:520px;margin-top:12px;border:1px solid var(--line);border-radius:18px;background:white"></iframe>
    </div>
  </div>
</section>
</main>
<script>
function render(){const h=document.getElementById('html').value,c=document.getElementById('css').value;document.getElementById('frame').srcdoc=`<!doctype html><html><head><style>${c}</style></head><body>${h}</body></html>`}
document.getElementById('run').onclick=render;render();
</script>
<footer class="footer">Built with HTML, CSS & JavaScript • <a href="projects.html">Explore projects</a></footer>
</div></div>
<div class="toast" id="toast"></div>
<script>
document.addEventListener("click",e=>{
  const b=e.target.closest(".btn,button");
  if(!b)return;
  const r=document.createElement("span"); r.className="ripple";
  const rect=b.getBoundingClientRect(), size=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=size+"px"; r.style.left=e.clientX-rect.left-size/2+"px"; r.style.top=e.clientY-rect.top-size/2+"px";
  b.appendChild(r); setTimeout(()=>r.remove(),650);
});
function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg; t.classList.add("show"); clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
</body>
</html>
