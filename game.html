<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Rush | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script>
<style>#arena{height:430px;position:relative;overflow:hidden;background:radial-gradient(circle at center,rgba(139,92,255,.12),transparent 55%),#070a17;border:1px solid var(--line);border-radius:22px}.target{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff 0 8%,var(--cyan) 9% 35%,var(--purple) 36% 65%,transparent 66%);cursor:pointer;filter:drop-shadow(0 0 20px rgba(88,230,255,.5))}</style></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main><section class="hero"><span class="eyebrow">🎮 Arcade</span><h1><span class="gradient-text">Neon Rush</span></h1><p class="subtitle">Tap the target before time runs out. Score and streak improve your level XP.</p></section><div class="card site-card"><div class="stats"><div class="stat"><strong id="score">0</strong><span>Score</span></div><div class="stat"><strong id="streak">0</strong><span>Streak</span></div><div class="stat"><strong id="time">30</strong><span>Seconds</span></div></div><div class="hero-actions"><button class="btn" id="start">Start Game</button></div><div id="arena"></div><div class="result" id="result">Press Start Game.</div></div></main><div id="foot"></div></div></div>
<script>
bootNav("projects");let score=0,streak=0,time=30,timer=null,active=false;const arena=document.getElementById("arena");
function spawn(){if(!active)return;arena.innerHTML="";const b=document.createElement("button");b.className="target";b.textContent="";b.style.left=Math.random()*82+"%";b.style.top=Math.random()*80+"%";b.onclick=()=>{score+=10+streak*2;streak++;document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;addXP(5);awardGroupPoints(3);spawn()};arena.appendChild(b)}
document.getElementById("start").onclick=()=>{clearInterval(timer);score=0;streak=0;time=30;active=true;document.getElementById("result").textContent="Go!";document.getElementById("score").textContent=0;document.getElementById("streak").textContent=0;document.getElementById("time").textContent=30;spawn();timer=setInterval(()=>{time--;document.getElementById("time").textContent=time;if(time<=0){clearInterval(timer);active=false;arena.innerHTML="";document.getElementById("result").textContent=`Game over — score ${score}.`;addXP(Math.floor(score/10));awardGroupPoints(Math.floor(score/20))}},1000)}
document.getElementById("foot").innerHTML=footer();
</script></body></html>
