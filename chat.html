<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Chat | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main><section class="hero"><span class="eyebrow">💬 Local demo</span><h1>Personal <span class="gradient-text">AI Chat</span></h1></section><div class="card tool-box"><div id="messages" style="min-height:280px"></div><div class="toolbar"><input id="q" class="input" placeholder="Ask something..."><button class="btn" id="send">Send</button></div></div></main><div id="foot"></div></div></div>
<script>bootNav("projects");const m=document.getElementById("messages"),q=document.getElementById("q");function add(who,t){m.insertAdjacentHTML("beforeend",`<div class="notice" style="margin-bottom:8px"><strong>${who}</strong><br>${escapeHTML(t)}</div>`);m.scrollTop=m.scrollHeight}function reply(s){const x=s.toLowerCase();return x.includes("hello")?"Hello! I'm your local AI-style demo.":x.includes("project")?"You can explore the Projects page for all demos.":x.includes("level")?"Play the Neon Rush game to earn XP.":"I can respond to a few simple local prompts. This page is not connected to a cloud AI model."}send.onclick=()=>{if(!q.value.trim())return;const x=q.value.trim();add("You",x);q.value="";setTimeout(()=>add("Assistant",reply(x)),300)};q.onkeydown=e=>{if(e.key==="Enter")send.click()};add("Assistant","Ready. Ask me about projects, levels or say hello.");document.getElementById("foot").innerHTML=footer()</script></body></html>
