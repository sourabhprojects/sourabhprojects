<!DOCTYPE html>
<html lang="en">
<head>
<title>Personal AI Chat | Sourabh Projects</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="container">
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.svg" alt="SM logo"><span>Sourabh Projects</span></a>
  <nav class="nav"><a class="" href="index.html">Home</a><a class="" href="projects.html">Projects</a><a class="" href="about.html">About</a></nav>
</header>

<main>
<section class="tool-box card">
  <h1>💬 Personal <span class="gradient-text">AI Chat</span></h1>
  <p class="lead">A local AI-style conversation demo. It does not call a paid AI service, so it works as a static website.</p>
  <div id="chatBox" style="height:390px;overflow:auto;padding:4px;display:grid;gap:10px"></div>
  <div class="toolbar" style="margin-top:14px">
    <input id="msg" class="input" placeholder="Ask: help, calculator, projects, hello…">
    <button class="btn" id="send">Send</button>
  </div>
  <div class="hero-actions" style="justify-content:flex-start">
    <button class="btn secondary quick" data-q="Hello">Hello</button>
    <button class="btn secondary quick" data-q="Show projects">Projects</button>
    <button class="btn secondary quick" data-q="What can you do?">Help</button>
  </div>
</section>
</main>
<script>
const box=document.getElementById('chatBox'),msg=document.getElementById('msg');
function bubble(text,me=false){const d=document.createElement('div');d.style.cssText=`max-width:82%;padding:11px 13px;border-radius:15px;line-height:1.55;${me?'justify-self:end;background:linear-gradient(135deg,#6e5ef5,#8b7bff)':'background:rgba(255,255,255,.05);border:1px solid var(--line)'}`;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight}
function reply(q){
  const s=q.toLowerCase();
  if(/hello|hi|hey/.test(s)) return 'Hello! 👋 I’m the local project assistant. Try asking about projects, calculator, game or help.';
  if(s.includes('project')) return 'You can try the Calculator, Neon Tap Game, Weather Checker, QR Generator, Jarvis, Android Lab, Web Playground and Creative Studio.';
  if(s.includes('calculator')) return 'Open calculator.html from the Projects page and enter expressions like (25+5)*2.';
  if(s.includes('weather')) return 'Use the Weather Checker to search a city and load live forecast data.';
  if(s.includes('who are you')||s.includes('what can you do')||s.includes('help')) return 'I’m a browser-only AI-style demo. I can answer a few project questions and guide you around the site.';
  return 'I don’t have a cloud AI model connected here yet. Try “projects”, “calculator”, “weather” or “help”.';
}
function send(q=msg.value.trim()){
 if(!q)return; bubble(q,true);msg.value='';
 setTimeout(()=>bubble(reply(q)),420);
}
document.getElementById('send').addEventListener('click',()=>send());
msg.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>send(b.dataset.q));
bubble('Welcome! 👋 Ask me about the projects on this website.');
</script>
<footer class="footer">Built with HTML, CSS & JavaScript • <a href="projects.html">Explore projects</a></footer>
</div></div>
<div class="toast" id="toast"></div>
<script>
document.addEventListener("click",e=>{
  const b=e.target.closest(".btn,button");
  if(!b)return;
  const r=document.createElement("span"); r.className="ripple";
  const rect=b.getBoundingClientRect(), size=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=size+"px"; r.style.left=e.clientX-rect.left-size/2+"px"; r.style.top=e.clientY-rect.top-size/2+"px";
  b.appendChild(r); setTimeout(()=>r.remove(),650);
});
function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg; t.classList.add("show"); clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
</body>
</html>
