<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main id="app"></main><div id="foot"></div></div></div>
<script>
if(requireLogin()){
bootNav("profile");const u=user(),app=document.getElementById("app");
function render(){
 const x=user(),banner=bannerCSS(x);
 app.innerHTML=`<section class="hero" style="text-align:left;padding-top:10px"><span class="eyebrow">👤 Player Profile</span><h1 style="margin-top:12px"><span class="gradient-text">${escapeHTML(x.name)}</span></h1><p class="subtitle" style="margin:8px 0">Level ${x.level} • ${x.xp} XP • ${escapeHTML(x.group)}</p></section>
 <section class="two"><div>
 <div class="profile-banner" style="background:${banner}"><div class="banner-content"><h2>${escapeHTML(x.name)}</h2><div class="level">LEVEL ${x.level} / 100</div></div></div>
 <div class="card site-card" style="margin-top:14px"><h2>Avatar</h2><p class="subtitle" style="margin:5px 0 14px;text-align:left">Higher levels unlock more choices.</p><div class="avatar-grid">${AVATARS.map(a=>`<button class="choice ${x.avatar===a.id?"selected":""} ${x.level<a.min?"locked":""}" data-a="${a.id}" ${x.level<a.min?"disabled":""}><div class="avatar">${a.emoji}</div><small>${a.name}</small><br><small>Lv ${a.min}+</small></button>`).join("")}</div></div>
 </div><div>
 <div class="card site-card"><h2>Banner</h2><p class="subtitle" style="margin:5px 0 14px;text-align:left">Unlock banners as your level grows.</p><div class="banner-grid">${BANNERS.map(b=>`<button class="choice ${x.banner===b.id?"selected":""} ${x.level<b.min?"locked":""}" data-b="${b.id}" ${x.level<b.min?"disabled":""}><div style="height:70px;border-radius:13px;background:${b.css};margin-bottom:8px"></div><small>${b.name}</small><br><small>Lv ${b.min}+</small></button>`).join("")}</div></div>
 <div class="card site-card" style="margin-top:14px"><h2>Account</h2><p class="subtitle" style="margin:7px 0;text-align:left">Name: ${escapeHTML(x.name)}<br>Username: ${escapeHTML(x.username)}<br>Group: ${escapeHTML(x.group)}</p><button class="btn danger" id="logout">Log out</button></div>
 </div></section>`;
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const z=user();z.avatar=b.dataset.a;saveUser(z);render()});
 document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const z=user();z.banner=b.dataset.b;saveUser(z);render()});
 document.getElementById("logout").onclick=()=>{localStorage.removeItem(APP+"_session");location.href="login.html"};
}
render();document.getElementById("foot").innerHTML=footer();
}
</script></body></html>
