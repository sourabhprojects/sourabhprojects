<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mailbox | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main id="app"></main><div id="foot"></div></div></div>
<script>
if(requireLogin()){
bootNav("mail");const app=document.getElementById("app");
function render(filter="all"){
 const u=user(),m=u.mails||[],shown=filter==="unread"?m.filter(x=>!x.read):m;
 app.innerHTML=`<section class="hero" style="text-align:left;padding-top:10px"><span class="eyebrow">📬 Personal Mailbox</span><h1><span class="gradient-text">Mailbox</span></h1><p class="subtitle" style="margin:8px 0;text-align:left">${m.length} messages • ${m.filter(x=>!x.read).length} unread</p></section>
 <div class="toolbar"><button class="btn ${filter==="all"?"":"secondary"}" id="all">All</button><button class="btn ${filter==="unread"?"":"secondary"}" id="unread">Unread</button><button class="btn secondary" id="welcome">Create welcome message</button></div>
 <section>${shown.length?shown.map(x=>`<article class="mail ${x.read?"":"unread"}"><div class="avatar">✉️</div><div class="mail-body"><h3>${escapeHTML(x.title)}</h3><small style="color:#77819e">${escapeHTML(x.date)}</small><p>${escapeHTML(x.body)}</p><div class="mail-actions">${!x.read?`<button class="btn secondary read" data-id="${x.id}">Mark as read</button>`:""}<button class="btn danger del" data-id="${x.id}">Delete</button></div></div></article>`).join(""):`<div class="card site-card"><h2>No messages</h2><p class="lead" style="margin:6px 0">Your mailbox is empty.</p></div>`}</section>`;
 document.getElementById("all").onclick=()=>render("all");document.getElementById("unread").onclick=()=>render("unread");
 document.getElementById("welcome").onclick=()=>{addMail(u.username,"Welcome back 👋","This is a local mailbox message. Later, the online version can connect this UI to a real backend.");render(filter)};
 document.querySelectorAll(".read").forEach(b=>b.onclick=()=>{const z=user(),q=z.mails.find(x=>String(x.id)===b.dataset.id);if(q)q.read=true;saveUser(z);render(filter)});
 document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{const z=user();z.mails=z.mails.filter(x=>String(x.id)!==b.dataset.id);saveUser(z);render(filter)});
}
render();document.getElementById("foot").innerHTML=footer();
}
</script></body></html>
