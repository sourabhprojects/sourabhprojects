<!DOCTYPE html>
<html lang="en">
<head>
<title>Advanced Calculator | Saurabh Projects</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="container">
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.svg" alt="SM logo"><span>Sourabh Projects</span></a>
  <nav class="nav"><a class="" href="index.html">Home</a><a class="" href="projects.html">Projects</a><a class="" href="about.html">About</a></nav>
</header>

<main>
<section class="tool-box card">
  <h1>🧮 Advanced <span class="gradient-text">Calculator</span></h1>
  <p class="lead">Use buttons, your keyboard, or type an expression directly.</p>
  <input id="display" class="input" style="font-size:1.45rem;text-align:right" readonly>
  <div class="project-grid" style="grid-template-columns:repeat(4,1fr);margin-top:12px">
    <button class="btn secondary" onclick="clearDisplay()">C</button><button class="btn secondary" onclick="add('(')">(</button><button class="btn secondary" onclick="add(')')">)</button><button class="btn" onclick="add('/')">÷</button>
    <button class="btn secondary" onclick="add('7')">7</button><button class="btn secondary" onclick="add('8')">8</button><button class="btn secondary" onclick="add('9')">9</button><button class="btn" onclick="add('*')">×</button>
    <button class="btn secondary" onclick="add('4')">4</button><button class="btn secondary" onclick="add('5')">5</button><button class="btn secondary" onclick="add('6')">6</button><button class="btn" onclick="add('-')">−</button>
    <button class="btn secondary" onclick="add('1')">1</button><button class="btn secondary" onclick="add('2')">2</button><button class="btn secondary" onclick="add('3')">3</button><button class="btn" onclick="add('+')">+</button>
    <button class="btn secondary" onclick="add('0')">0</button><button class="btn secondary" onclick="add('.')">.</button><button class="btn success" onclick="calculate()">=</button><button class="btn secondary" onclick="backspace()">⌫</button>
  </div>
  <div class="notice" style="margin-top:14px">Tip: keyboard numbers and <strong>Enter</strong> work too.</div>
</section>
</main>
<script>
const d=document.getElementById('display');
function add(v){d.value+=v}
function clearDisplay(){d.value=''}
function backspace(){d.value=d.value.slice(0,-1)}
function calculate(){
  try{
    const expr=d.value.replace(/×/g,'*').replace(/÷/g,'/');
    if(!expr.trim())return;
    if(!/^[0-9+\\-*/().\\s]+$/.test(expr)) throw new Error();
    const result=Function('"use strict";return ('+expr+')')();
    if(!Number.isFinite(result)) throw new Error();
    d.value=String(result);
  }catch{d.value='Error';toast('Invalid expression')}
}
document.addEventListener('keydown',e=>{
  if((e.key>='0'&&e.key<='9')||'+-*/().'.includes(e.key))add(e.key);
  else if(e.key==='Enter')calculate(); else if(e.key==='Backspace')backspace(); else if(e.key==='Escape')clearDisplay();
});
</script>
<footer class="footer">Built with HTML, CSS & JavaScript • <a href="projects.html">Explore projects</a></footer>
</div></div>
<div class="toast" id="toast"></div>
<script>
document.addEventListener("click",e=>{
  const b=e.target.closest(".btn,button");
  if(!b)return;
  const r=document.createElement("span"); r.className="ripple";
  const rect=b.getBoundingClientRect(), size=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=size+"px"; r.style.left=e.clientX-rect.left-size/2+"px"; r.style.top=e.clientY-rect.top-size/2+"px";
  b.appendChild(r); setTimeout(()=>r.remove(),650);
});
function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg; t.classList.add("show"); clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
</body>
</html>
