<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android Lab | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main><section class="hero"><span class="eyebrow">📱 Mobile UI</span><h1>Android <span class="gradient-text">Lab</span></h1></section><div class="project-grid">
<div class="card site-card"><h2>📝 Notes</h2><textarea id="note" class="textarea" placeholder="Write a note..."></textarea><button class="btn" id="save">Save Note</button><div id="saved" class="notice">No saved note.</div></div>
<div class="card site-card"><h2>⏱️ Timer</h2><div id="timer" style="font-size:3rem;text-align:center;margin:20px">30</div><button class="btn" id="start">Start 30s</button></div>
<div class="card site-card"><h2>🎨 Color Lab</h2><input type="color" id="color" value="#8b5cff" style="width:100%;height:70px"><div id="swatch" style="height:100px;border-radius:18px;margin-top:12px"></div></div>
</div></main><div id="foot"></div></div></div>
<script>bootNav("projects");const n=document.getElementById("note"),saved=document.getElementById("saved");n.value=localStorage.getItem(APP+"_note")||"";saved.textContent=n.value?"Saved note loaded.":"No saved note.";save.onclick=()=>{localStorage.setItem(APP+"_note",n.value);saved.textContent="Saved on this browser."};let t=30,iv;start.onclick=()=>{clearInterval(iv);t=30;timer.textContent=t;iv=setInterval(()=>{timer.textContent=--t;if(t<=0)clearInterval(iv)},1000)};function paint(){swatch.style.background=color.value}color.oninput=paint;paint();document.getElementById("foot").innerHTML=footer()</script></body></html>
