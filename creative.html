<!DOCTYPE html>
<html lang="en">
<head>
<title>Creative Digital Studio | Sourabh Projects</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="container">
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.svg" alt="SM logo"><span>Sourabh Projects</span></a>
  <nav class="nav"><a class="" href="index.html">Home</a><a class="" href="projects.html">Projects</a><a class="" href="about.html">About</a></nav>
</header>

<main>
<section class="tool-box card">
  <h1>🎨 Creative <span class="gradient-text">Studio</span></h1>
  <p class="lead">Generate a colorful background and copy the CSS directly into your own projects.</p>
  <div id="preview" style="height:300px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(135deg,#7c5cff,#26d0ce);display:grid;place-items:center;box-shadow:inset 0 0 80px rgba(0,0,0,.14)">
    <div class="card" style="padding:20px;text-align:center;background:rgba(5,7,14,.55);backdrop-filter:blur(10px)"><strong>Creative Preview</strong><br><span id="hex">#7C5CFF</span></div>
  </div>
  <div class="row" style="margin-top:16px">
    <div class="field"><label>Color A</label><input id="c1" class="input" type="color" value="#7c5cff"></div>
    <div class="field"><label>Color B</label><input id="c2" class="input" type="color" value="#26d0ce"></div>
  </div>
  <div class="hero-actions">
    <button class="btn" id="random">✨ Randomize</button>
    <button class="btn secondary" id="copy">Copy CSS</button>
  </div>
  <div class="result" id="css"></div>
</section>
</main>
<script>
const p=document.getElementById('preview'),a=document.getElementById('c1'),b=document.getElementById('c2'),css=document.getElementById('css'),hex=document.getElementById('hex');
function update(){const v=`linear-gradient(135deg, ${a.value}, ${b.value})`;p.style.background=v;css.textContent=`background: ${v};`;hex.textContent=`${a.value.toUpperCase()} → ${b.value.toUpperCase()}`}
[a,b].forEach(x=>x.addEventListener('input',update));
document.getElementById('random').onclick=()=>{for(const x of [a,b])x.value='#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');update()};
document.getElementById('copy').onclick=()=>{navigator.clipboard?.writeText(css.textContent);toast('CSS copied')};
update();
</script>
<footer class="footer">Built with HTML, CSS & JavaScript • <a href="projects.html">Explore projects</a></footer>
</div></div>
<div class="toast" id="toast"></div>
<script>
document.addEventListener("click",e=>{
  const b=e.target.closest(".btn,button");
  if(!b)return;
  const r=document.createElement("span"); r.className="ripple";
  const rect=b.getBoundingClientRect(), size=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=size+"px"; r.style.left=e.clientX-rect.left-size/2+"px"; r.style.top=e.clientY-rect.top-size/2+"px";
  b.appendChild(r); setTimeout(()=>r.remove(),650);
});
function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg; t.classList.add("show"); clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
</body>
</html>
