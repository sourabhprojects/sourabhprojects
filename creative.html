<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Studio | Sourabh Projects</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="page"><div class="container"><div id="navMount"></div><main><section class="hero"><span class="eyebrow">🎨 Creative</span><h1>Digital <span class="gradient-text">Studio</span></h1></section><div class="card tool-box"><div class="row"><div><div class="field"><label>Color 1</label><input type="color" id="c1" value="#8b5cff"></div><div class="field"><label>Color 2</label><input type="color" id="c2" value="#58e6ff"></div><button class="btn" id="random">Randomize</button></div><div id="preview" style="min-height:260px;border-radius:24px"></div></div><div class="result" id="cssout"></div></div></main><div id="foot"></div></div></div>
<script>bootNav("projects");function paint(){const s=`linear-gradient(135deg,${c1.value},${c2.value})`;preview.style.background=s;cssout.textContent="background: "+s+";"}c1.oninput=paint;c2.oninput=paint;random.onclick=()=>{c1.value="#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");c2.value="#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");paint()};paint();document.getElementById("foot").innerHTML=footer()</script></body></html>
